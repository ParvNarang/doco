<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Bounding Box Viewer</title>
    <!-- Include PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        :root {
            --bg-color: #0f1115;
            --panel-bg: #1a1d24;
            --accent-blue: #3b82f6;
            --accent-red: #45cb1c;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header Navigation */
        .header {
            padding: 16px 32px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid #2d313a;
            display: flex;
            gap: 30px;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .brand {
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-right: auto;
        }

        .file-input-group {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .file-input-group:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .file-input-group label {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input[type="file"] {
            font-size: 0.875rem;
            color: var(--text-main);
        }

        input[type="file"]::file-selector-button {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            background: #374151;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            background: #4b5563;
        }

        /* Main Workspace layout */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Left Side: Document Viewer */
        .viewer-pane {
            flex: 1;
            overflow: auto;
            position: relative;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center; /* Center horizontally */
            padding: 40px;
            gap: 40px; /* space between pages */
        }

        /* We'll dynamically create page wrappers in the pane */
        .page-wrapper {
            position: relative;
            display: inline-block;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            background: white; /* Helpful for transparent PNGs/PDFs */
        }

        .page-wrapper img, .page-wrapper canvas {
            display: block;
            max-width: 100%;
        }

        /* Right Side: Data Panel */
        .data-pane {
            width: 350px;
            background-color: var(--panel-bg);
            border-left: 1px solid #2d313a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .data-header {
            padding: 16px;
            border-bottom: 1px solid #2d313a;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .data-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
            color: var(--text-muted);
        }

        .data-content .key {
            color: #60a5fa;
            font-weight: 500;
        }

        .data-content .val {
            color: #a78bfa;
        }

        /* Bounding Boxes */
        .bbox {
            position: absolute;
            box-sizing: border-box;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 3px;
        }
        
        /* Cell Level (Table Cells - Blue) */
        .bbox.cell {
            z-index: 20;
            pointer-events: auto;
        }
        .bbox.cell:hover, .bbox.cell.active {
            border-color: var(--accent-blue);
            background-color: rgba(59, 130, 246, 0.25);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            z-index: 50;
            transform: scale(1.01);
        }

        /* Chunk Level (Text/Layout Chunks - Red) */
        .bbox.chunk {
            z-index: 10;
            pointer-events: auto;
        }
        .bbox.chunk:hover, .bbox.chunk.active {
            border-color: var(--accent-red);
            background-color: rgba(119, 239, 68, 0.15);
            box-shadow: 0 0 15px rgba(68, 239, 162, 0.4);
            z-index: 40;
            transform: scale(1.01);
        }

        /* Instructions Empty State */
        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text-muted);
            pointer-events: none;
        }

        .empty-state h2 {
            color: var(--text-main);
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">WizCommerce BBox Viewer</div>
        <div class="file-input-group">
            <label for="docInput">1. Select Document (Image/PDF):</label>
            <input type="file" id="docInput" accept="image/*,.pdf">
        </div>
        <div class="file-input-group">
            <label for="jsonInput">2. Select Extracted JSON:</label>
            <input type="file" id="jsonInput" accept=".json">
        </div>
    </div>
    
    <div class="workspace">
        <div class="viewer-pane" id="viewerPane">
            <div class="empty-state" id="emptyState">
                <h2>No Document Loaded</h2>
                <p>Please upload an Image/PDF and JSON file from the top menu.</p>
            </div>
            <!-- Page wrappers will be injected here -->
        </div>

        <!-- Data Info Pane -->
        <div class="data-pane">
            <div class="data-header">Hovered Element Data</div>
            <div class="data-content" id="dataContent">
                Hover over a bounding box on the document to view its extracted data and markdown.
            </div>
        </div>
    </div>

    <script>
        const docInput = document.getElementById('docInput');
        const jsonInput = document.getElementById('jsonInput');
        const viewerPane = document.getElementById('viewerPane');
        const emptyState = document.getElementById('emptyState');
        const dataContent = document.getElementById('dataContent');

        let currentDocObjUrl = null;
        let documentData = null; // Will store the parsed JSON ({chunks, grounding})
        let pagesData = []; // Array of layer divs keyed by pageIndex

        // -- Event Listeners --
        docInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) {
                if (currentDocObjUrl) URL.revokeObjectURL(currentDocObjUrl);
                currentDocObjUrl = URL.createObjectURL(file);
                
                emptyState.style.display = 'none';
                clearViewer();

                if (file.type === 'application/pdf') {
                    await handlePDF(currentDocObjUrl);
                } else {
                    await handleImage(currentDocObjUrl);
                }
                
                if (documentData) renderBoxes(documentData);
            }
        });

        jsonInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    try {
                        const parsed = JSON.parse(evt.target.result);
                        documentData = {
                            chunks: parsed.chunks || [],
                            grounding: parsed.grounding || {}
                        };
                        console.log("Loaded JSON data:", documentData);
                        
                        if (pagesData.length > 0) {
                            renderBoxes(documentData);
                        }
                    } catch (err) {
                        alert("Failed to parse JSON target file.");
                        console.error(err);
                    }
                };
                reader.readAsText(file);
            }
        });

        function clearViewer() {
            // Remove all existing page wrappers
            document.querySelectorAll('.page-wrapper').forEach(el => el.remove());
            pagesData = [];
        }

        async function handlePDF(fileUrl) {
            try {
                const loadingTask = pdfjsLib.getDocument(fileUrl);
                const pdf = await loadingTask.promise;

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    // Use scale 1.5 for better resolution visually
                    const viewport = page.getViewport({ scale: 1.5 });

                    const { wrapper, bboxLayer } = createPageContainer(pageNum - 1);
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    wrapper.insertBefore(canvas, bboxLayer);

                    const renderContext = {
                        canvasContext: context,
                        viewport: viewport
                    };
                    await page.render(renderContext).promise;
                }
            } catch (err) {
                console.error("Error rendering PDF:", err);
                alert("Failed to render PDF document.");
            }
        }

        async function handleImage(fileUrl) {
            return new Promise((resolve) => {
                const { wrapper, bboxLayer } = createPageContainer(0); // images default to page 0
                
                const img = document.createElement('img');
                img.src = fileUrl;
                img.onload = () => {
                    resolve();
                };
                wrapper.insertBefore(img, bboxLayer);
            });
        }

        function createPageContainer(pageIndex) {
            const wrapper = document.createElement('div');
            wrapper.className = 'page-wrapper';
            wrapper.id = 'page-' + pageIndex;
            
            const bboxLayer = document.createElement('div');
            bboxLayer.className = 'bbox-layer';
            bboxLayer.style.position = 'absolute';
            bboxLayer.style.top = '0';
            bboxLayer.style.left = '0';
            bboxLayer.style.width = '100%';
            bboxLayer.style.height = '100%';
            
            wrapper.appendChild(bboxLayer);
            viewerPane.appendChild(wrapper);

            pagesData[pageIndex] = bboxLayer; // Store reference to layer by page index
            return { wrapper, bboxLayer };
        }

        // -- Rendering Logic --
        function renderBoxes(data) {
            // Clear previous boxes from all layers
            pagesData.forEach(layer => { if(layer) layer.innerHTML = ''; });

            // Render Chunks (Red, Lower Z-Index)
            if (data.chunks && Array.isArray(data.chunks)) {
                data.chunks.forEach(chunk => {
                    const grounding = chunk.grounding;
                    if (grounding && grounding.box) {
                        const pageNum = grounding.page || 0;
                        createBoxElement(grounding.box, pageNum, 'chunk', chunk);
                    }
                });
            }

            // Render Cells (Blue, Higher Z-Index)
            if (data.grounding && typeof data.grounding === 'object') {
                Object.values(data.grounding).forEach(item => {
                    if (item.type === 'tableCell' && item.box) {
                        const pageNum = item.page || 0;
                        createBoxElement(item.box, pageNum, 'cell', item);
                    }
                });
            }
        }

        function createBoxElement(boxArgs, pageNum, className, dataNode) {
            const layer = pagesData[pageNum];
            if (!layer) return; // Ignore if page doesn't exist in document

            const left = boxArgs.left;
            const top = boxArgs.top;
            const right = boxArgs.right;
            const bottom = boxArgs.bottom;

            const box = document.createElement('div');
            box.classList.add('bbox', className);

            box.style.left = (left * 100) + '%';
            box.style.top = (top * 100) + '%';
            box.style.width = ((right - left) * 100) + '%';
            box.style.height = ((bottom - top) * 100) + '%';

            // Events for interaction
            box.addEventListener('mouseenter', (e) => {
                e.stopPropagation();
                updateSidePanel(dataNode, className);
                document.querySelectorAll('.bbox.active').forEach(e => e.classList.remove('active'));
                box.classList.add('active');
            });

            box.addEventListener('mouseleave', (e) => {
                box.classList.remove('active');
            });

            layer.appendChild(box);
        }

        function updateSidePanel(dataNode, type) {
            let html = ``;
            html += `<div><span class="key">Element Type:</span> <span class="val">${type.toUpperCase()}</span></div><br>`;
            
            for (const [k, v] of Object.entries(dataNode)) {
                if (k === 'grounding' || k === 'box') continue;
                
                let displayVal = v;
                if (typeof v === 'object' && v !== null) {
                    displayVal = JSON.stringify(v, null, 2);
                } 

                if (k === 'markdown') {
                    html += `<div><span class="key">Markdown Content:</span></div>`;
                    html += `<div style="background:#2d313a; padding:8px; border-radius:4px; margin-top:4px; font-family:monospace; font-size: 0.8rem; overflow-x: auto">${escapeHTML(displayVal)}</div><br>`;
                } else {
                    html += `<div><span class="key">${k}:</span> <span class="val">${displayVal}</span></div>`;
                }
            }

            dataContent.innerHTML = html;
        }

        function escapeHTML(str) {
            if (typeof str !== 'string') return str;
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        window.addEventListener('unload', () => {
            if (currentDocObjUrl) URL.revokeObjectURL(currentDocObjUrl);
        });
    </script>
</body>
</html>
